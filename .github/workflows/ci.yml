name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy, rustfmt

      - run: cargo check --workspace
      - run: cargo check --workspace --all-features
      - run: cargo test --workspace
      - run: cargo test --workspace --features runtime
      - run: cargo clippy --workspace --all-features -- -D warnings
      - run: cargo fmt --check

  publish-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy

      - name: cargo publish --dry-run (dependency order)
        run: |
          for crate in bare-metal-evm-types bare-metal-evm-keccak bare-metal-evm-nibble bare-metal-evm-rlp bare-metal-evm-trie bare-metal-evm-state bare-metal-evm-gas; do
            echo "==> DRY-RUN: $crate"
            output=$(cargo publish -p "$crate" --registry crates-io --dry-run --allow-dirty 2>&1) && {
              echo "OK: $crate dry-run passed"
            } || {
              if echo "$output" | grep -q "already exists"; then
                echo "SKIP: $crate (already published)"
              elif echo "$output" | grep -q "failed to select a version"; then
                echo "SKIP: $crate (dependency not yet published)"
              else
                echo "FAIL: $crate"
                echo "$output"
                exit 1
              fi
            }
          done

  publish:
    name: Publish to crates.io and GitHub Packages
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Publish to crates.io (dependency order)
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "WARN: CARGO_REGISTRY_TOKEN not set — skipping publish"
            exit 0
          fi
          publish_crate() {
            local pkg=$1
            echo "==> PUBLISH: $pkg"
            output=$(cargo publish -p "$pkg" --registry crates-io 2>&1) && {
              echo "OK: $pkg published"
              sleep 15
              return 0
            } || {
              if echo "$output" | grep -q "already exists"; then
                echo "SKIP: $pkg (already published)"
                return 0
              else
                echo "FAIL: $pkg"
                echo "$output"
                return 1
              fi
            }
          }
          publish_crate bare-metal-evm-types
          publish_crate bare-metal-evm-keccak
          publish_crate bare-metal-evm-nibble
          publish_crate bare-metal-evm-rlp
          publish_crate bare-metal-evm-trie
          publish_crate bare-metal-evm-state
          publish_crate bare-metal-evm-gas
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_TOKEN }}

      - name: Publish to GitHub Packages (dependency order)
        run: |
          if [ -z "${CARGO_REGISTRIES_GITHUB_TOKEN}" ]; then
            echo "WARN: CARGO_REGISTRIES_GITHUB_TOKEN not set — skipping publish"
            exit 0
          fi
          publish_crate() {
            local pkg=$1
            echo "==> PUBLISH: $pkg"
            output=$(cargo publish -p "$pkg" --registry github 2>&1) && {
              echo "OK: $pkg published"
              sleep 15
              return 0
            } || {
              if echo "$output" | grep -q "already exists"; then
                echo "SKIP: $pkg (already published)"
                return 0
              else
                echo "FAIL: $pkg"
                echo "$output"
                return 1
              fi
            }
          }
          publish_crate bare-metal-evm-types
          publish_crate bare-metal-evm-keccak
          publish_crate bare-metal-evm-nibble
          publish_crate bare-metal-evm-rlp
          publish_crate bare-metal-evm-trie
          publish_crate bare-metal-evm-state
          publish_crate bare-metal-evm-gas
        env:
          CARGO_REGISTRIES_GITHUB_TOKEN: ${{ secrets.GITHUB_PACKAGES_TOKEN }}
